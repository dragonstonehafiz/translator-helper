<text class="sub" x="178" y="857" text-anchor="middle">progress bar · result</text>
<g class="frame"><rect x="184" y="622" width="726" height="254" rx="6"/><path class="tag" d="M184,622 H506 V640 L496,648 H184 Z"/><text x="194" y="639">loop · every 1 s until status is not processing</text></g>
<path class="edge" d="M104,948 H398" marker-end="url(#arrow)"/>

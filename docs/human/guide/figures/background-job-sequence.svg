<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1154" viewBox="0 0 1240 1154" role="img" aria-labelledby="title desc">
<title id="title">Background job request sequence</title>
<desc id="desc">Translate-file example of a background job. TranslateComponent calls ApiService.translateFile, which posts to /translate/translate-file. The route calls start_translate_file, which hands the tasks to TaskOrchestrator.run and the route answers processing. StateService then polls /task-results/translate_file every second while the orchestrator runs each task on its worker, tasks call the LLM, and the workflow&#x27;s finish step saves the output file. When the poll returns complete, the page lists and downloads the file.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; fill: #1c2330; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; }
  .sub { font-size: 11px; fill: #5b6475; }
  .node rect { stroke-width: 1.5; }
  .fe rect { fill: #efe9fa; stroke: #6a4bb3; }
  .route rect { fill: #e6effa; stroke: #2f6fb3; }
  .sync rect { fill: #f8eedd; stroke: #8a5a14; }
  .db rect { fill: #e4f4ec; stroke: #2c8a5a; }
  .lifeline { stroke: #c3c9d3; stroke-width: 1.2; stroke-dasharray: 4 4; }
  .edge { fill: none; stroke: #5b6475; stroke-width: 1.6; }
  .edge.reply { stroke: #2f6fb3; stroke-dasharray: 6 5; }
  .arrowhead { fill: #5b6475; }
  .arrowhead.reply { fill: #2f6fb3; }
  .frame rect { fill: none; stroke: #8a93a3; stroke-width: 1.2; }
  .frame .tag { fill: #f0f2f5; stroke: #8a93a3; stroke-width: 1.2; }
  .frame text { font-size: 11px; font-weight: 700; fill: #5b6475; }
  .legend text { font-size: 10px; fill: #5b6475; }
  .legend rect { stroke-width: 1.2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1f27; }
    text { fill: #e6e9ef; }
    .sub, .frame text, .legend text { fill: #9aa3b2; }
    .fe rect { fill: #2a2340; stroke: #b9a2f5; }
    .route rect { fill: #1b2a3d; stroke: #7db3ef; }
    .sync rect { fill: #342816; stroke: #e7b56a; }
    .db rect { fill: #183126; stroke: #6fd3a0; }
    .lifeline { stroke: #3a4352; }
    .edge { stroke: #9aa3b2; }
    .edge.reply { stroke: #7db3ef; }
    .arrowhead { fill: #9aa3b2; }
    .arrowhead.reply { fill: #7db3ef; }
    .frame rect { stroke: #6b7486; }
    .frame .tag { fill: #222833; stroke: #6b7486; }
  }
</style>
<rect class="bg" width="1240" height="1154" rx="10"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead reply" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<!-- Layers -->
<g class="node fe"><rect x="38" y="20" width="132" height="50" rx="7"/><text x="104" y="41" text-anchor="middle">TranslateComponent<tspan class="sub" x="104" dy="17">pages/translate</tspan></text></g>
<g class="node fe"><rect x="186" y="20" width="132" height="50" rx="7"/><text x="251" y="41" text-anchor="middle">StateService<tspan class="sub" x="251" dy="17">services/state.service.ts</tspan></text></g>
<g class="node fe"><rect x="333" y="20" width="132" height="50" rx="7"/><text x="399" y="41" text-anchor="middle">ApiService<tspan class="sub" x="399" dy="17">services/api.service.ts</tspan></text></g>
<g class="node route"><rect x="480" y="20" width="132" height="50" rx="7"/><text x="546" y="41" text-anchor="middle">FastAPI route<tspan class="sub" x="546" dy="17">routes/</tspan></text></g>
<g class="node sync"><rect x="628" y="20" width="132" height="50" rx="7"/><text x="694" y="41" text-anchor="middle">Workflow<tspan class="sub" x="694" dy="17">translate_file.py</tspan></text></g>
<g class="node sync"><rect x="776" y="20" width="132" height="50" rx="7"/><text x="841" y="41" text-anchor="middle">TaskOrchestrator<tspan class="sub" x="841" dy="17">task_orchestrator.py</tspan></text></g>
<g class="node sync"><rect x="923" y="20" width="132" height="50" rx="7"/><text x="989" y="41" text-anchor="middle">Tasks<tspan class="sub" x="989" dy="17">translate_file/</tspan></text></g>
<g class="node db"><rect x="1070" y="20" width="132" height="50" rx="7"/><text x="1136" y="41" text-anchor="middle">LLM<tspan class="sub" x="1136" dy="17">LLMInterface</tspan></text></g>
<line class="lifeline" x1="104" y1="70" x2="104" y2="1104"/>
<line class="lifeline" x1="251" y1="70" x2="251" y2="1104"/>
<line class="lifeline" x1="399" y1="70" x2="399" y2="1104"/>
<line class="lifeline" x1="546" y1="70" x2="546" y2="1104"/>
<line class="lifeline" x1="694" y1="70" x2="694" y2="1104"/>
<line class="lifeline" x1="841" y1="70" x2="841" y2="1104"/>
<line class="lifeline" x1="989" y1="70" x2="989" y2="1104"/>
<line class="lifeline" x1="1136" y1="70" x2="1136" y2="1104"/>

<path class="edge" d="M104,118 H398" marker-end="url(#arrow)"/>
<text class="code" x="251" y="111" text-anchor="middle">translateFile(file, seriesId, …)</text>
<path class="edge" d="M399,156 H545" marker-end="url(#arrow)"/>
<text class="code" x="472" y="149" text-anchor="middle">POST /translate/translate-file</text>
<path class="edge" d="M546,194 H693" marker-end="url(#arrow)"/>
<text class="code" x="620" y="187" text-anchor="middle">start_translate_file(…)</text>
<path class="edge" d="M694,232 H840" marker-end="url(#arrow)"/>
<text class="code" x="768" y="225" text-anchor="middle">run(workflow, tasks, data)</text>
<path class="edge reply" d="M546,270 H400" marker-end="url(#arrow-reply)"/>
<text class="sub" x="472" y="263" text-anchor="middle">processing · {workflow}</text>
<path class="edge reply" d="M399,308 H105" marker-end="url(#arrow-reply)"/>
<text class="sub" x="251" y="301" text-anchor="middle">processing</text>
<path class="edge" d="M104,346 H250" marker-end="url(#arrow)"/>
<text class="code" x="178" y="339" text-anchor="middle">trackWorkflow(&quot;translate_file&quot;)</text>
<path class="edge" d="M841,424 H988" marker-end="url(#arrow)"/>
<text class="code" x="915" y="417" text-anchor="middle">run_task() for each task</text>
<path class="edge" d="M989,462 H1135" marker-end="url(#arrow)"/>
<text class="code" x="1062" y="455" text-anchor="middle">infer(prompt, system_prompt)</text>
<path class="edge reply" d="M1136,500 H990" marker-end="url(#arrow-reply)"/>
<text class="sub" x="1062" y="493" text-anchor="middle">reply text</text>
<path class="edge reply" d="M989,538 H842" marker-end="url(#arrow-reply)"/>
<text class="sub" x="915" y="531" text-anchor="middle">task output data</text>
<path class="edge" d="M841,576 H695" marker-end="url(#arrow)"/>
<text class="code" x="768" y="569" text-anchor="middle">_finish(data)</text>
<text class="sub" x="768" y="591" text-anchor="middle">saves files/outputs/translated/…</text>
<g class="frame"><rect x="626" y="372" width="578" height="230" rx="6"/><path class="tag" d="M626,372 H759 V390 L749,398 H626 Z"/><text x="636" y="389">background worker</text></g>
<path class="edge" d="M251,674 H398" marker-end="url(#arrow)"/>
<text class="code" x="325" y="667" text-anchor="middle">getWorkflowResult(workflow)</text>
<path class="edge" d="M399,712 H545" marker-end="url(#arrow)"/>
<text class="code" x="472" y="705" text-anchor="middle">GET /task-results/translate_file</text>
<path class="edge" d="M546,750 H840" marker-end="url(#arrow)"/>
<text class="code" x="694" y="743" text-anchor="middle">get_state_handler().get(workflow)</text>
<path class="edge reply" d="M546,788 H400" marker-end="url(#arrow-reply)"/>
<text class="sub" x="472" y="781" text-anchor="middle">processing · progress, then complete · result</text>

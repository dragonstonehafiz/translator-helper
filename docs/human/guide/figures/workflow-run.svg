<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
<title id="title">How a workflow runs</title>
<desc id="desc">A FastAPI route calls start_translate_file, which builds TranslationData and the task list and passes them to TaskOrchestrator.run. On the background worker the orchestrator runs TaskPrepareTranslationBatches, TaskSelectLibraryContext and TaskTranslateBatches in order, passing each task output to the next task as its input, then calls finish and cleanup. Tasks report their stage and progress to TaskStateHandler, and the orchestrator records the result there.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; fill: #1c2330; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; }
  .sub { font-size: 11px; fill: #5b6475; }
  .node rect { stroke-width: 1.5; }
  .fe rect { fill: #efe9fa; stroke: #6a4bb3; }
  .route rect { fill: #e6effa; stroke: #2f6fb3; }
  .sync rect { fill: #f8eedd; stroke: #8a5a14; }
  .db rect { fill: #e4f4ec; stroke: #2c8a5a; }
  .lifeline { stroke: #c3c9d3; stroke-width: 1.2; stroke-dasharray: 4 4; }
  .edge { fill: none; stroke: #5b6475; stroke-width: 1.6; }
  .edge.reply { stroke: #2f6fb3; stroke-dasharray: 6 5; }
  .arrowhead { fill: #5b6475; }
  .arrowhead.reply { fill: #2f6fb3; }
  .frame rect { fill: none; stroke: #8a93a3; stroke-width: 1.2; }
  .frame .tag { fill: #f0f2f5; stroke: #8a93a3; stroke-width: 1.2; }
  .frame text { font-size: 11px; font-weight: 700; fill: #5b6475; }
  .legend text { font-size: 10px; fill: #5b6475; }
  .legend rect { stroke-width: 1.2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1f27; }
    text { fill: #e6e9ef; }
    .sub, .frame text, .legend text { fill: #9aa3b2; }
    .fe rect { fill: #2a2340; stroke: #b9a2f5; }
    .route rect { fill: #1b2a3d; stroke: #7db3ef; }
    .sync rect { fill: #342816; stroke: #e7b56a; }
    .db rect { fill: #183126; stroke: #6fd3a0; }
    .lifeline { stroke: #3a4352; }
    .edge { stroke: #9aa3b2; }
    .edge.reply { stroke: #7db3ef; }
    .arrowhead { fill: #9aa3b2; }
    .arrowhead.reply { fill: #7db3ef; }
    .frame rect { stroke: #6b7486; }
    .frame .tag { fill: #222833; stroke: #6b7486; }
  }
</style>
<rect class="bg" width="800" height="760" rx="10"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead reply" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<g class="node route"><rect x="110" y="20" width="320" height="46" rx="7"/><text x="270" y="40" text-anchor="middle">FastAPI route<tspan class="sub" x="270" dy="16">POST /translate/translate-file</tspan></text></g>
<g class="node sync"><rect x="110" y="110" width="320" height="46" rx="7"/><text x="270" y="130" text-anchor="middle">start_translate_file()<tspan class="sub" x="270" dy="16">workflows/translate_file.py</tspan></text></g>
<g class="node sync"><rect x="110" y="200" width="320" height="46" rx="7"/><text x="270" y="220" text-anchor="middle">TaskOrchestrator.run()<tspan class="sub" x="270" dy="16">rejects if busy, otherwise queues the run</tspan></text></g>
<path class="edge" d="M270,66 V109" marker-end="url(#arrow)"/>
<text class="code" x="282" y="92">start_translate_file(file_path, …)</text>
<path class="edge" d="M270,156 V199" marker-end="url(#arrow)"/>
<text class="code" x="282" y="182">run(workflow, tasks, data, finish, cleanup)</text>
<g class="frame"><rect x="60" y="280" width="410" height="440" rx="6"/><path class="tag" d="M60,280 H292 V298 L282,306 H60 Z"/><text x="70" y="297">background worker · _execute()</text></g>
<path class="edge" d="M270,246 V319" marker-end="url(#arrow)"/>
<text class="code" x="282" y="312">TranslationData</text>
<g class="node sync"><rect x="110" y="320" width="320" height="46" rx="7"/><text x="270" y="340" text-anchor="middle">TaskPrepareTranslationBatches<tspan class="sub" x="270" dy="16">adds the batch plan</tspan></text></g>
<g class="node sync"><rect x="110" y="410" width="320" height="46" rx="7"/><text x="270" y="430" text-anchor="middle">TaskSelectLibraryContext<tspan class="sub" x="270" dy="16">fills context and library_context</tspan></text></g>
<g class="node sync"><rect x="110" y="500" width="320" height="46" rx="7"/><text x="270" y="520" text-anchor="middle">TaskTranslateBatches<tspan class="sub" x="270" dy="16">translates every batch</tspan></text></g>
<g class="node sync"><rect x="110" y="590" width="320" height="46" rx="7"/><text x="270" y="610" text-anchor="middle">finish()<tspan class="sub" x="270" dy="16">saves the file, returns FileOutputData</tspan></text></g>
<g class="node sync"><rect x="110" y="660" width="320" height="46" rx="7"/><text x="270" y="680" text-anchor="middle">cleanup()<tspan class="sub" x="270" dy="16">deletes the uploaded temp file</tspan></text></g>
<path class="edge" d="M270,366 V409" marker-end="url(#arrow)"/>
<text class="code" x="282" y="392">PlannedTranslationData</text>
<path class="edge" d="M270,456 V499" marker-end="url(#arrow)"/>
<text class="code" x="282" y="482">PlannedTranslationData</text>
<path class="edge" d="M270,546 V589" marker-end="url(#arrow)"/>
<text class="code" x="282" y="572">TranslatedSubtitleData</text>
<path class="edge" d="M270,636 V659" marker-end="url(#arrow)"/>
<g class="node db"><rect x="570" y="330" width="200" height="56" rx="7"/><text x="670.0" y="354" text-anchor="middle">TaskStateHandler<tspan class="sub" x="670.0" dy="16">one record per workflow</tspan></text></g>
<path class="edge reply" d="M430,343 L569,358.0" marker-end="url(#arrow-reply)"/>
<path class="edge reply" d="M430,433 L569,358.0" marker-end="url(#arrow-reply)"/>
<path class="edge reply" d="M430,523 L569,358.0" marker-end="url(#arrow-reply)"/>
<text class="sub" x="670.0" y="318" text-anchor="middle">start_stage() · report_progress()</text>
<g class="node db"><rect x="570" y="590" width="200" height="46" rx="7"/><text x="670.0" y="610" text-anchor="middle">Output file<tspan class="sub" x="670.0" dy="16">files/outputs/translated/</tspan></text></g>
<path class="edge" d="M430,613 H569" marker-end="url(#arrow)"/>
<text class="code" x="500.0" y="606" text-anchor="middle">save_subtitles()</text>
<path class="edge reply" d="M430,683 L590,387" marker-end="url(#arrow-reply)"/>
<text class="sub" x="442" y="705">then complete(result) · fail(error)</text>
<path class="edge reply" d="M110,223 H80 V43 H109" marker-end="url(#arrow-reply)"/>
<text class="sub" x="72" y="133" text-anchor="middle" transform="rotate(-90 72 133)">returns · route answers processing</text>
<g class="node route"><rect x="570" y="470" width="200" height="46" rx="7"/><text x="670.0" y="490" text-anchor="middle">FastAPI route<tspan class="sub" x="670.0" dy="16">GET /task-results/{workflow}</tspan></text></g>
<path class="edge" d="M690.0,470 V387" marker-end="url(#arrow)"/>
<path class="edge reply" d="M730.0,386 V469" marker-end="url(#arrow-reply)"/>
<text class="code" x="682.0" y="432.0" text-anchor="end">get(workflow)</text>
<text class="sub" x="736.0" y="432.0">record</text>
<g class="legend" aria-hidden="true"><path class="edge" d="M30,744 H54" marker-end="url(#arrow)"/><text x="60" y="747">call, labelled with the data passed</text><path class="edge reply" d="M240,744 H264" marker-end="url(#arrow-reply)"/><text x="270" y="747">state update or response</text></g>
</svg>

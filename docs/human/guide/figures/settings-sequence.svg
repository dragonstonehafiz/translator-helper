<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="998" viewBox="0 0 1140 998" role="img" aria-labelledby="title desc">
<title id="title">Settings request sequence</title>
<desc id="desc">Settings page requests the settings schema, which the route builds from each provider&#x27;s config. Loading a model posts the settings; ModelManager applies and saves them to the provider&#x27;s JSON file, then initializes the client and the route answers success or error. Every second the page also reads server variables and running status from ModelManager.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; fill: #1c2330; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; }
  .sub { font-size: 11px; fill: #5b6475; }
  .node rect { stroke-width: 1.5; }
  .fe rect { fill: #efe9fa; stroke: #6a4bb3; }
  .route rect { fill: #e6effa; stroke: #2f6fb3; }
  .sync rect { fill: #f8eedd; stroke: #8a5a14; }
  .db rect { fill: #e4f4ec; stroke: #2c8a5a; }
  .lifeline { stroke: #c3c9d3; stroke-width: 1.2; stroke-dasharray: 4 4; }
  .edge { fill: none; stroke: #5b6475; stroke-width: 1.6; }
  .edge.reply { stroke: #2f6fb3; stroke-dasharray: 6 5; }
  .arrowhead { fill: #5b6475; }
  .arrowhead.reply { fill: #2f6fb3; }
  .frame rect { fill: none; stroke: #8a93a3; stroke-width: 1.2; }
  .frame .tag { fill: #f0f2f5; stroke: #8a93a3; stroke-width: 1.2; }
  .frame text { font-size: 11px; font-weight: 700; fill: #5b6475; }
  .legend text { font-size: 10px; fill: #5b6475; }
  .legend rect { stroke-width: 1.2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1f27; }
    text { fill: #e6e9ef; }
    .sub, .frame text, .legend text { fill: #9aa3b2; }
    .fe rect { fill: #2a2340; stroke: #b9a2f5; }
    .route rect { fill: #1b2a3d; stroke: #7db3ef; }
    .sync rect { fill: #342816; stroke: #e7b56a; }
    .db rect { fill: #183126; stroke: #6fd3a0; }
    .lifeline { stroke: #3a4352; }
    .edge { stroke: #9aa3b2; }
    .edge.reply { stroke: #7db3ef; }
    .arrowhead { fill: #9aa3b2; }
    .arrowhead.reply { fill: #7db3ef; }
    .frame rect { stroke: #6b7486; }
    .frame .tag { fill: #222833; stroke: #6b7486; }
  }
</style>
<rect class="bg" width="1140" height="998" rx="10"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead reply" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<!-- Layers -->
<g class="node fe"><rect x="38" y="20" width="164" height="50" rx="7"/><text x="120" y="41" text-anchor="middle">SettingsComponent<tspan class="sub" x="120" dy="17">pages/settings</tspan></text></g>
<g class="node fe"><rect x="218" y="20" width="164" height="50" rx="7"/><text x="300" y="41" text-anchor="middle">ApiService<tspan class="sub" x="300" dy="17">services/api.service.ts</tspan></text></g>
<g class="node route"><rect x="398" y="20" width="164" height="50" rx="7"/><text x="480" y="41" text-anchor="middle">FastAPI route<tspan class="sub" x="480" dy="17">routes/utils.py</tspan></text></g>
<g class="node sync"><rect x="578" y="20" width="164" height="50" rx="7"/><text x="660" y="41" text-anchor="middle">ModelManager<tspan class="sub" x="660" dy="17">models/manager.py</tspan></text></g>
<g class="node db"><rect x="758" y="20" width="164" height="50" rx="7"/><text x="840" y="41" text-anchor="middle">Provider client<tspan class="sub" x="840" dy="17">LLM · audio · search</tspan></text></g>
<g class="node db"><rect x="938" y="20" width="164" height="50" rx="7"/><text x="1020" y="41" text-anchor="middle">Config file<tspan class="sub" x="1020" dy="17">files/config/*.json</tspan></text></g>
<line class="lifeline" x1="120" y1="70" x2="120" y2="948"/>
<line class="lifeline" x1="300" y1="70" x2="300" y2="948"/>
<line class="lifeline" x1="480" y1="70" x2="480" y2="948"/>
<line class="lifeline" x1="660" y1="70" x2="660" y2="948"/>
<line class="lifeline" x1="840" y1="70" x2="840" y2="948"/>
<line class="lifeline" x1="1020" y1="70" x2="1020" y2="948"/>

<path class="edge" d="M120,118 H299" marker-end="url(#arrow)"/>
<text class="code" x="210" y="111" text-anchor="middle">getSettingsSchema()</text>
<path class="edge" d="M300,156 H479" marker-end="url(#arrow)"/>
<text class="code" x="390" y="149" text-anchor="middle">GET /utils/settings-schema</text>
<path class="edge" d="M480,194 H839" marker-end="url(#arrow)"/>
<text class="code" x="660" y="187" text-anchor="middle">client.config.to_frontend()</text>
<text class="sub" x="660" y="209" text-anchor="middle">client from get_*_client()</text>
<path class="edge reply" d="M480,246 H301" marker-end="url(#arrow-reply)"/>
<text class="sub" x="390" y="239" text-anchor="middle">success · schema per client</text>
<path class="edge reply" d="M300,284 H121" marker-end="url(#arrow-reply)"/>
<text class="sub" x="210" y="277" text-anchor="middle">render form fields</text>
<path class="edge" d="M120,366 H299" marker-end="url(#arrow)"/>
<text class="code" x="210" y="359" text-anchor="middle">loadLlmModel(settings)</text>
<path class="edge" d="M300,404 H479" marker-end="url(#arrow)"/>
<text class="code" x="390" y="397" text-anchor="middle">POST /utils/load-llm-model</text>
<path class="edge" d="M480,442 H659" marker-end="url(#arrow)"/>
<text class="code" x="570" y="435" text-anchor="middle">load_llm_model(settings)</text>
<path class="edge" d="M660,480 H839" marker-end="url(#arrow)"/>
<text class="code" x="750" y="473" text-anchor="middle">config.from_frontend() · save()</text>
<path class="edge" d="M840,518 H1019" marker-end="url(#arrow)"/>
<text class="code" x="930" y="511" text-anchor="middle">write llm_deepseek.json</text>
<path class="edge" d="M660,556 H839" marker-end="url(#arrow)"/>
<text class="code" x="750" y="549" text-anchor="middle">initialize()</text>
<path class="edge reply" d="M840,594 H661" marker-end="url(#arrow-reply)"/>
<text class="sub" x="750" y="587" text-anchor="middle">LOADED, or raises</text>
<path class="edge reply" d="M480,632 H301" marker-end="url(#arrow-reply)"/>
<text class="sub" x="390" y="625" text-anchor="middle">success · &quot;LLM loaded&quot;, or error · message</text>
<path class="edge reply" d="M300,670 H121" marker-end="url(#arrow-reply)"/>
<text class="sub" x="210" y="663" text-anchor="middle">show result</text>
<g class="frame"><rect x="36" y="314" width="1068" height="368" rx="6"/><path class="tag" d="M36,314 H396 V332 L386,340 H36 Z"/><text x="46" y="331">load: loadLlmModel / loadAudioModel / loadSearchModel</text></g>
<path class="edge" d="M120,754 H299" marker-end="url(#arrow)"/>
<text class="code" x="210" y="747" text-anchor="middle">getServerVariables() · checkRunning()</text>
<path class="edge" d="M300,792 H479" marker-end="url(#arrow)"/>
<text class="code" x="390" y="785" text-anchor="middle">GET /utils/server-variables · /utils/running</text>
<path class="edge" d="M480,830 H659" marker-end="url(#arrow)"/>
<text class="code" x="570" y="823" text-anchor="middle">is_*_ready() · *_in_use · loading flags</text>
<path class="edge reply" d="M480,868 H301" marker-end="url(#arrow-reply)"/>
<text class="sub" x="390" y="861" text-anchor="middle">success · readiness and flags</text>
<path class="edge reply" d="M300,906 H121" marker-end="url(#arrow-reply)"/>
<text class="sub" x="210" y="899" text-anchor="middle">update status</text>
<g class="frame"><rect x="36" y="702" width="708" height="216" rx="6"/><path class="tag" d="M36,702 H308 V720 L298,728 H36 Z"/><text x="46" y="719">loop · every 1 s while the page is open</text></g>

<!-- Legend -->
<g class="legend" aria-hidden="true">
  <path class="edge" d="M30,976 H54" marker-end="url(#arrow)"/><text x="60" y="979">call</text>
  <path class="edge reply" d="M100,976 H124" marker-end="url(#arrow-reply)"/><text x="130" y="979">response</text>
  <g class="node fe"><rect x="200" y="970" width="14" height="12" rx="2"/></g><text x="220" y="979">frontend</text>
  <g class="node route"><rect x="292" y="970" width="14" height="12" rx="2"/></g><text x="312" y="979">API route</text>
  <g class="node sync"><rect x="390" y="970" width="14" height="12" rx="2"/></g><text x="410" y="979">backend logic</text>
  <g class="node db"><rect x="512" y="970" width="14" height="12" rx="2"/></g><text x="532" y="979">model or storage</text>
</g>
</svg>
